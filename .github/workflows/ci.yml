name: ci

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: Yeqingky/dujiao-next

jobs:
  build:
    name: Build and push branch image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image tag
        id: image
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          branch="${BRANCH_NAME//\//-}"
          branch="$(printf '%s' "$branch" | tr -c '[:alnum:]_.-' '-')"
          branch="${branch,,}"
          while [[ "$branch" == [-.]* ]]; do
            branch="${branch:1}"
          done
          [[ -n "$branch" ]] || branch="branch"
          branch="${branch:0:120}"

          tag="${branch}-${COMMIT_SHA:0:7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building image tag: $tag"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.image.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.tag }}
